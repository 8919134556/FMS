{% extends "base_auth.html" %}
{% block title %}Check Your Email · {{ fms_app_name }}{% endblock %}
{% block auth_content %}
  <div class="text-center">
    <div class="empty-icon mx-auto mb-2" style="background: var(--fms-primary-soft); color: var(--fms-primary);">
      <i class="bi bi-envelope-check"></i>
    </div>
    <h1 class="section-title">Check your email</h1>
    <p class="text-secondary-fms text-small">
      If an account exists with that email address, we've sent instructions for resetting the password.
    </p>
    <a href="{% url 'accounts:login' %}" class="text-small">Back to sign in</a>
  </div>
{% endblock %}
