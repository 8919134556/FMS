{% extends "base.html" %}
{% block title %}Password Changed · {{ fms_app_name }}{% endblock %}
{% block content %}
  <div class="card-fms p-4 text-center" style="max-width: 460px;">
    <div class="empty-icon mx-auto mb-2" style="background: var(--fms-success-soft); color: var(--fms-success);">
      <i class="bi bi-check-lg"></i>
    </div>
    <h1 class="section-title">Password updated</h1>
    <p class="text-secondary-fms text-small">Your password has been changed successfully.</p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary btn-sm">Back to Dashboard</a>
  </div>
{% endblock %}
