<div class="toast fms-toast show align-items-center border-0 mb-2" role="alert">
  <div class="d-flex">
    <div class="toast-body d-flex align-items-start gap-2">
      <i class="bi bi-{{ icon }}" style="color: var(--fms-{{ tone }}); font-size: 1rem; margin-top: 1px;"></i>
      <span>{{ message }}</span>
    </div>
    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
  </div>
</div>
