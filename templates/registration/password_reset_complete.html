{% extends "base_auth.html" %}
{% block title %}Password Reset Complete · {{ fms_app_name }}{% endblock %}
{% block auth_content %}
  <div class="text-center">
    <div class="empty-icon mx-auto mb-2" style="background: var(--fms-success-soft); color: var(--fms-success);">
      <i class="bi bi-check-lg"></i>
    </div>
    <h1 class="section-title">Password reset complete</h1>
    <p class="text-secondary-fms text-small">Your password has been set. You can now sign in.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm">Sign in</a>
  </div>
{% endblock %}
